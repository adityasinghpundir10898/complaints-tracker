{% extends "base.html" %}
{% block title %}New complaint - SDM Complaint Tracker{% endblock %}
{% block content %}
<article class="narrow">
  <h2>New complaint</h2>
  <p>Step 1 of 2: upload the complaint. Nothing is saved until you confirm on the next screen.</p>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_div }}
    <button type="submit">Upload and continue</button>
  </form>
</article>
{% endblock %}
