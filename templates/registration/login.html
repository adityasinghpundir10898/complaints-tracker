{% extends "base.html" %}
{% block title %}Log in - SDM Complaint Tracker{% endblock %}
{% block content %}
<div class="login-wrap">
<article class="login">
  <div class="login-brand">
    <span class="brand-mark">C</span>
    <div><strong>SDM Complaint Tracker</strong><span>Sign in to continue</span></div>
  </div>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}<p class="error" role="alert">Wrong username or password.</p>{% endif %}
    <label>Username {{ form.username }}</label>
    <label>Password {{ form.password }}</label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>
</article>
</div>
{% endblock %}
